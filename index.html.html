<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>70GAP コピペ解析版</title><style>body{font-family:-apple-system,sans-serif;margin:0;background:#f4f6f5;color:#18231b}header{background:#205f31;color:#fff;padding:16px}main{max-width:950px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;font:inherit}textarea{min-height:330px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}button{padding:11px 14px;margin:4px;border:0;border-radius:8px;background:#26733a;color:#fff;font-weight:bold}.notice{background:#fff7d7;padding:10px;border-radius:8px;font-size:13px}.race{border:1px solid #d8dfda;border-radius:10px;padding:10px;margin:8px 0}.buy{background:#edfaef}.title{font-size:18px;font-weight:bold}.tag{background:#e4eee6;padding:3px 8px;border-radius:12px;font-size:12px}.small{font-size:12px;color:#566}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:7px}td,th{border:1px solid #ddd;padding:5px;text-align:center}.bet{background:#f5f8f6;padding:8px;margin-top:8px;border-radius:8px}</style></head><body><header><h1>70GAP</h1><div>日刊コンピ指数表 コピペ一括解析版</div></header><main><div class="card"><div class="grid"><label>日付<input id="date" type="date"></label><label>開催地<select id="place"><option>笠松</option><option>園田</option><option>浦和</option><option>船橋</option><option>大井</option><option>川崎</option><option>金沢</option><option>名古屋</option><option>高知</option><option>佐賀</option><option>門別</option><option>盛岡</option><option>水沢</option></select></label><label>解析<input value="日刊コンピ コピペ" readonly></label></div></div><div class="card"><h2>📋 指数表を貼り付け</h2><div class="notice">日刊コンピからコピーした内容を、そのまま1R〜最終Rまで貼り付けて「一括解析」を押してください。</div><textarea id="paste" placeholder="ここにコピー内容を貼り付け"></textarea><button id="parse">🔍 全レースを一括解析</button><button id="sample">サンプル</button><div id="status"></div></div><div class="card" id="result" style="display:none"><h2>🎯 70GAP 判定結果</h2><div id="out"></div></div></main><script>
const $=x=>document.getElementById(x);$('date').value=new Date().toISOString().slice(0,10);
$('sample').onclick=()=>{$('paste').value=`1R

function blocks(t){let m=[...t.matchAll(/(?:^|\n)\s*(\d{1,2})\s*R\s*(?:\n|$)/g)];return m.map((x,i)=>({r:+x[1],t:t.slice(x.index+(x[0].startsWith('\n')?1:0),i+1<m.length?m[i+1].index:t.length)}))}
function parse(b){let a=[],seen=new Set(),nums=(b.t.match(/\d+/g)||[]).map(Number);for(let i=0;i<nums.length-1;i++){let idx=nums[i],h=nums[i+1];if(idx>=40&&idx<=99&&h>=1&&h<=16&&!seen.has(h)){a.push({horse:h,index:idx});seen.add(h);i++}}return a.sort((x,y)=>y.index-x.index)}
function band(n){return Math.floor(n/10)}function end(a){let e=0;a.forEach((v,i)=>{if(band(v.index)===5)e=i+1});return e}
function pat(a){let d=a.map(x=>band(x.index)),e=end(a);if(![5,6,7,8].includes(e))return null;let p=[['73A',[7,7,6,5]],['74A',[7,7,6,6,5]],['73B',[7,6,6,5]],['74B',[7,6,6,6,5]],['83B',[8,6,6,5]],['84B',[8,6,6,6,5]]];for(let x of p)if(x[1].every((v,i)=>d[i]===v))return x[0];return null}
function buy(a){if(a.length<9||a.length>12||a[2].index>64)return null;let g45=a[3].index-a[4].index,g59=a[4].index-a[8].index;if(g45>=3&&g45<=9&&g59<=10)return'高配当3連複';if(g59>=11)return'上位決着';return null}
function bet(a,t){let h=n=>a[n-1].horse;if(t==='高配当3連複')return`1列目：${[1,2,3,4].map(h).join('.')}<br>2列目：${[1,2,3,4].map(h).join('.')}<br>3列目：(${h(5)}).${[6,7,8,9].map(h).join('.')}<br><b>30点・3,000円</b>`;return`3連単フォーメーション15点＋押さえ3連複5点<br><b>合計20点・2,000円</b>`}
$('parse').onclick=()=>{let bs=blocks($('paste').value),place=$('place').value;if(!bs.length){alert('1R、2Rの形式を含むデータを貼り付けてください');return}let rs=bs.map(b=>{let a=parse(b),p=pat(a),e=end(a),t=p?buy(a):null;return{...b,a,p,e,t}});$('status').textContent=rs.length+'レース検出';$('result').style.display='block';$('out').innerHTML=rs.map(x=>{let label=x.p?x.p+['','','','','','⑤','⑥','⑦','⑧'][x.e]:'非購入';return`<div class="race ${x.t?'buy':''}"><div class="title">${place}${x.r}R <span class="tag">${label}</span></div><table><tr><th>順位</th>${x.a.map((_,i)=>'<th>'+(i+1)+'位</th>').join('')}</tr><tr><th>馬番</th>${x.a.map(v=>'<td>'+v.horse+'</td>').join('')}</tr><tr><th>指数</th>${x.a.map(v=>'<td>'+v.index+'</td>').join('')}</tr></table><p><b>${x.t||'非購入'}</b></p>${x.t?'<div class="bet">'+bet(x.a,x.t)+'</div>':''}</div>`}).join('')};
</script></body></html>
