<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>70GAP｜スクリーンショット読取版</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--green:#2f7d32;--bg:#f4f6f5;--card:#fff;--red:#b93a46;--blue:#2364b5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:#1d2420}
header{background:linear-gradient(135deg,#184d25,#3d8b45);color:#fff;padding:18px}
header h1{margin:0;font-size:26px}.sub{opacity:.85;font-size:13px;margin-top:4px}
main{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr!important}}
label{font-weight:700;font-size:14px;display:block}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4cf;border-radius:9px;margin-top:5px;background:#fff}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;margin:4px 2px}button.secondary{background:#55615b}button.danger{background:#b94a4a}
.notice{background:#fff8d8;border-left:5px solid #d7ad00;padding:10px;border-radius:8px;font-size:13px;line-height:1.55}
#previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}.preview{border:1px solid #ddd;border-radius:10px;padding:6px;background:#fafafa}.preview img{width:100%;max-height:320px;object-fit:contain}
.progress{height:10px;background:#e4e9e6;border-radius:8px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:var(--green);transition:.2s}
pre{white-space:pre-wrap;background:#111;color:#ddd;padding:10px;border-radius:8px;max-height:250px;overflow:auto;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #d5ddd8;padding:6px;text-align:center}th{background:#e9f1eb}.buy{background:#e9f6ea}.no{background:#f6eeee}.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:800;background:#e6ece8}
.raceCard{border:1px solid #d7dfda;border-radius:12px;padding:12px;margin:10px 0}.raceTitle{font-size:18px;font-weight:900}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.small{font-size:12px;color:#5e6962}.resultBtns button{min-width:72px}.hit{background:#167b36!important}.miss{background:#a53a3a!important}
.hidden{display:none}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<header><h1>70GAP</h1><div class="sub">日刊コンピ指数｜スクリーンショット一括読み取り・判定・成績管理</div></header>
<main>
<div class="card">
<div class="formgrid3">
<label>日付<input id="date" type="date"></label>
<label>開催地<select id="place"><option>笠松</option><option>園田</option><option>姫路</option><option>浦和</option><option>船橋</option><option>大井</option><option>川崎</option><option>金沢</option><option>名古屋</option><option>高知</option><option>佐賀</option><option>門別</option><option>盛岡</option><option>水沢</option><option>帯広</option></select></label>
<label>画像<select id="mode"><option value="ocr">OCR自動読み取り</option><option value="manual">読み取り後に手動確認</option></select></label>
</div>
</div>

<div class="card">
<h2>📷 スクリーンショット読み込み</h2>
<div class="notice"><b>1枚または複数枚を選択できます。</b><br>1枚に1R〜最終Rが収まらない場合は、上下に分けた複数枚をまとめて読み込めます。OCR結果は必ず確認・修正してから70GAP判定してください。</div>
<input id="files" type="file" accept="image/*" multiple>
<div id="previews"></div>
<button id="ocrBtn">🔍 スクリーンショットを自動読み取り</button>
<button class="secondary" id="clearBtn">画像をクリア</button>
<div class="progress"><div class="bar" id="bar"></div></div><div id="status" class="small">画像を選択してください。</div>
<div id="rawWrap" class="hidden"><h3>OCR生テキスト（確認用）</h3><pre id="raw"></pre></div>
</div>

<div class="card">
<h2>📝 読み取り結果・手動修正</h2>
<div class="small">OCRが数字を読み違えた場合は、ここで直接修正できます。1行＝1レース。形式：<span class="mono">馬番/指数,馬番/指数,...</span>（順位順）</div>
<textarea id="raceInput" rows="12" placeholder="例：8/83,7/69,2/62,4/61,3/60,1/47,5/46,6/40"></textarea>
<button id="parseBtn">70GAP判定</button>
<button class="secondary" id="sampleBtn">サンプルを入れる</button>
</div>

<div class="card hidden" id="resultsWrap">
<h2>🎯 判定結果</h2>
<div id="summary"></div>
<div id="results"></div>
</div>

<div class="card hidden" id="historyWrap">
<h2>📊 成績</h2>
<div id="historySummary"></div>
<button class="secondary" id="exportBtn">CSVエクスポート</button>
<button class="danger" id="clearHistoryBtn">成績を全削除</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
$('date').value=new Date().toISOString().slice(0,10);
let selectedFiles=[], lastParsed=[], ocrText='';

$('files').addEventListener('change',e=>{
 selectedFiles=[...e.target.files];
 $('previews').innerHTML='';
 selectedFiles.forEach(f=>{
   const u=URL.createObjectURL(f), d=document.createElement('div'); d.className='preview';
   d.innerHTML=`<img src="${u}"><div class="small">${f.name}</div>`;$('previews').appendChild(d);
 });
 $('status').textContent=selectedFiles.length+'枚の画像を選択しました。';
});
$('clearBtn').onclick=()=>{$('files').value='';selectedFiles=[];$('previews').innerHTML='';$('raceInput').value='';$('rawWrap').classList.add('hidden');$('status').textContent='クリアしました。'};

async function doOCR(){
 if(!selectedFiles.length){alert('スクリーンショットを選択してください。');return}
 if(!window.Tesseract){alert('OCRライブラリの読み込みに失敗しました。ネット接続を確認してください。');return}
 $('ocrBtn').disabled=true;ocrText='';let allLines=[];
 for(let i=0;i<selectedFiles.length;i++){
   $('status').textContent=`${i+1}/${selectedFiles.length}枚をOCR解析中…`;
   const {data}=await Tesseract.recognize(selectedFiles[i],'eng',{
     logger:m=>{if(m.status==='recognizing text')$('bar').style.width=((i+m.progress)/selectedFiles.length*100)+'%'}
   });
   ocrText+=`\n--- ${selectedFiles[i].name} ---\n`+data.text;
   allLines.push(...extractNumericRows(data));
 }
 $('bar').style.width='100%';$('raw').textContent=ocrText;$('rawWrap').classList.remove('hidden');
 const pairs=pairRows(allLines);
 if(pairs.length){
   $('raceInput').value=pairs.map((p,i)=>`${i+1}R: `+p.map(x=>`${x.horse}/${x.index}`).join(',')).join('\n');
   $('status').textContent=`OCR候補を${pairs.length}レース分作成しました。数字を確認して「70GAP判定」を押してください。`;
 }else{
   $('status').textContent='OCR文字は取得しましたが、表の自動整形ができませんでした。OCR生テキストを参考に手動入力してください。';
 }
 $('ocrBtn').disabled=false;
}
$('ocrBtn').onclick=doOCR;

// TesseractのTSV相当データを、Y座標ごとの数字行にまとめる
function extractNumericRows(data){
 const words=(data.words||[]).filter(w=>/^\d{1,2}$/.test((w.text||'').trim()) && w.confidence>25);
 const lines=[];
 words.sort((a,b)=>a.bbox.y0-b.bbox.y0||a.bbox.x0-b.bbox.x0).forEach(w=>{
   let line=lines.find(l=>Math.abs(l.y-w.bbox.y0)<10);
   if(!line){line={y:w.bbox.y0, items:[]};lines.push(line)}
   line.items.push({n:+w.text,x:w.bbox.x0});
 });
 return lines.map(l=>({y:l.y, nums:l.items.sort((a,b)=>a.x-b.x).map(a=>a.n)}))
   .filter(l=>l.nums.length>=6);
}
function pairRows(lines){
 // 数字が6個以上の連続行を「馬番行→指数行」とみなし、指数行は40〜99中心で判定
 const out=[];
 for(let i=0;i<lines.length-1;i++){
   const a=lines[i].nums,b=lines[i+1].nums;
   const horse=a.filter(n=>n>=1&&n<=16);
   const index=b.filter(n=>n>=40&&n<=99);
   if(horse.length>=6&&index.length>=6){
      const n=Math.min(horse.length,index.length,12);
      out.push(Array.from({length:n},(_,j)=>({horse:horse[j],index:index[j]})));
      i++;
   }
 }
 return out;
}

function decade(n){return Math.floor(n/10)}
function fiftyEnd(arr){
 const ranks=arr.map((x,i)=>decade(x.index)===5?i+1:0).filter(Boolean);
 if(!ranks.length)return null;
 return Math.max(...ranks);
}
function pattern(arr){
 if(arr.length<5)return null;
 const d=arr.map(x=>decade(x.index));
 const end=fiftyEnd(arr);
 if(![5,6,7,8].includes(end))return null;
 if(d[0]===7&&d[1]===7&&d[2]===6&&d[3]===5)return '73A';
 if(d[0]===7&&d[1]===7&&d[2]===6&&d[3]===6&&d[4]===5)return '74A';
 if(d[0]===7&&d[1]===6&&d[2]===6&&d[3]===5)return '73B';
 if(d[0]===7&&d[1]===6&&d[2]===6&&d[3]===6&&d[4]===5)return '74B';
 if(d[0]===8&&d[1]===6&&d[2]===6&&d[3]===5)return '83B';
 if(d[0]===8&&d[1]===6&&d[2]===6&&d[3]===6&&d[4]===5)return '84B';
 return null;
}
function purchaseType(arr){
 if(arr.length<9||arr.length>12)return null;
 const i=x=>arr[x-1].index;
 if(i(3)>64)return null;
 const d45=i(4)-i(5), d59=i(5)-i(9);
 if(d45>=3&&d45<=9&&d59<=10)return '高配当3連複';
 if(d59>=11)return '上位決着';
 return null;
}
function comb(arr,type){
 const h=r=>arr[r-1]?.horse;
 if(type==='高配当3連複'){
   return {points:30,stake:3000,
   text:`1列目：${[1,2,3,4].map(h).join('.')}\n2列目：${[1,2,3,4].map(h).join('.')}\n3列目：(${h(5)}).${[6,7,8,9].map(h).join('.')}\n基本30点・3,000円（今後20点程度へ調整可能）`};
 }
 if(type==='上位決着'){
   return {points:20,stake:2000,
   text:`3連単フォーメーション：15点\n① ${h(1)} → ${[2,3,4].map(h).join('.')} → ${[4,5].map(h).join('.')}\n② ${h(1)} → ${[4,5].map(h).join('.')} → ${[2,3,4].map(h).join('.')}\n③ ${[2,3,4].map(h).join('.')} → ${h(1)} → ${[4,5].map(h).join('.')}\n押さえ3連複：${[2,3,4,5].map(h).join('.')} BOX 4点 ＋ ${[2,3,4].map(h).join('.')} BOX 1点\n合計20点・2,000円`};
 }
 return null;
}
function parseInput(){
 const lines=$('raceInput').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 lastParsed=[];
 lines.forEach((line,idx)=>{
   const m=line.match(/^\s*(\d+)\s*R\s*[:：]?\s*(.*)$/i); const rn=m?+m[1]:idx+1; const body=m?m[2]:line;
   const arr=[...body.matchAll(/(\d{1,2})\s*\/\s*(\d{2})/g)].map(m=>({horse:+m[1],index:+m[2]}));
   if(arr.length>=5)lastParsed.push({race:rn,arr});
 });
 renderResults();
}
$('parseBtn').onclick=parseInput;
$('sampleBtn').onclick=()=>{
 $('raceInput').value='1R: 8/83,7/69,2/62,4/61,3/60,1/47,5/46,6/40\n2R: 3/84,6/77,2/60,4/55,1/54,7/50,5/40';
};

function renderResults(){
 const place=$('place').value,date=$('date').value;
 const rows=[];
 lastParsed.forEach(r=>{
   const p=pattern(r.arr), f=fiftyEnd(r.arr), t=p?purchaseType(r.arr):null, c=t?comb(r.arr,t):null;
   rows.push({r,p,f,t,c});
 });
 $('resultsWrap').classList.remove('hidden');$('historyWrap').classList.remove('hidden');
 const buy=rows.filter(x=>x.t).length;
 $('summary').innerHTML=`<b>${date} ${place}</b>｜解析 ${rows.length}R｜購入対象 <b>${buy}R</b>`;
 $('results').innerHTML=rows.map(x=>{
   const cls=x.t?'buy':'no';
   const label=x.p?`${x.p}⑧`.replace('⑧',x.f?'⑥⑦⑧⑤'.includes('⑧')?'⑧':'':''):'非購入';
   const tag=x.p?`${x.p}${x.f?['','①','②','③','④','⑤','⑥','⑦','⑧'][x.f]:''}`:'非購入';
   const detail=x.t?`<b>${x.t}</b><br><span class="small">${x.c.text.replace(/\n/g,'<br>')}</span>`:'<span class="small">パターンまたは購入条件に該当しません</span>';
   return `<div class="raceCard ${cls}"><div class="raceTitle">${place}${x.r.race}R　<span class="tag">${tag}</span></div>
   <div class="small">順位順：${x.r.arr.map((a,i)=>`${i+1}位 ${a.horse}番/${a.index}`).join('　')}</div><p>${detail}</p>
   ${x.t?`<div class="resultBtns"><button class="hit" onclick="saveResult('${date}','${place}',${x.r.race},'${tag}','${x.t}',${x.c.stake},true)">◯ 的中</button>
   <button class="miss" onclick="saveResult('${date}','${place}',${x.r.race},'${tag}','${x.t}',${x.c.stake},false)">× 不的中</button>
   <input id="pay_${x.r.race}" type="number" min="0" placeholder="的中時の払戻金額"></div>`:''}</div>`;
 }).join('');
 renderHistory();
}

window.saveResult=function(date,place,race,pat,type,stake,hit){
 let payout=0;
 if(hit){payout=+($('pay_'+race).value||0);if(!payout){alert('払戻金額を入力してください。');return}}
 const key='70gap_history_v1';const a=JSON.parse(localStorage.getItem(key)||'[]');
 const item={date,place,race,pattern:pat,type,stake,hit,payout,at:new Date().toISOString()};
 const old=a.findIndex(x=>x.date===date&&x.place===place&&x.race===race&&x.type===type);
 if(old>=0)a[old]=item;else a.push(item);localStorage.setItem(key,JSON.stringify(a));
 alert('結果を保存しました。');renderHistory();
}
function renderHistory(){
 const a=JSON.parse(localStorage.getItem('70gap_history_v1')||'[]');
 const bets=a.length,hits=a.filter(x=>x.hit).length,stake=a.reduce((s,x)=>s+x.stake,0),pay=a.reduce((s,x)=>s+x.payout,0);
 const rate=bets?hits/bets*100:0, roi=stake?pay/stake*100:0;
 $('historySummary').innerHTML=`<b>購入 ${bets}R｜的中 ${hits}R｜不的中 ${bets-hits}R</b><br>的中率：${rate.toFixed(1)}％　購入：${stake.toLocaleString()}円　払戻：${pay.toLocaleString()}円　回収率：${roi.toFixed(1)}％　収支：${(pay-stake>=0?'+':'')+(pay-stake).toLocaleString()}円`;
}
$('clearHistoryBtn').onclick=()=>{if(confirm('保存済み成績をすべて削除しますか？')){localStorage.removeItem('70gap_history_v1');renderHistory();}};
$('exportBtn').onclick=()=>{
 const a=JSON.parse(localStorage.getItem('70gap_history_v1')||'[]');
 const csv=['日付,開催地,R,パターン,購入タイプ,購入額,結果,払戻',...a.map(x=>[x.date,x.place,x.race,x.pattern,x.type,x.stake,x.hit?'的中':'不的中',x.payout].join(','))].join('\n');
 const blob=new Blob(["\ufeff"+csv],{type:'text/csv'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='70GAP_history.csv';link.click();URL.revokeObjectURL(u);
};
renderHistory();
</script>
</body></html>
